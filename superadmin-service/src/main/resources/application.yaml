spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  thymeleaf:
    cache: false

  redis:
    host: ${REDIS_HOST}
    port: 6379

jwt:
  superadmin:
    secret: ${JWT_SUPERADMIN_SECRET}

logging:
  level:
    org.hibernate.SQL: debug